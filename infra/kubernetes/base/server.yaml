apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e-agent-data
  namespace: e-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-agent-server
  namespace: e-agent
  labels:
    app.kubernetes.io/name: e-agent
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e-agent
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-agent
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: e-agent-server:0.1.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: e-agent-config
          env:
            - name: E_AGENT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: e-agent-secrets
                  key: session-secret
            - name: E_AGENT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: e-agent-secrets
                  key: master-key
            - name: E_AGENT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: e-agent-secrets
                  key: bootstrap-token
                  # 仅为已完成初始化、已移除一次性令牌的现有数据库保留可选性。
                  optional: true
          ports:
            - name: http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: e-agent-data
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: e-agent-server
  namespace: e-agent
spec:
  selector:
    app.kubernetes.io/name: e-agent
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 4318
      targetPort: http
