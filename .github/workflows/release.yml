name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish, for example 0.1.2
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  NODE_VERSION: '22.22.0'
  PNPM_VERSION: '11.9.0'
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release-version.outputs.normalized }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        id: release-version
        shell: bash
        run: |
          node scripts/release/check-release-version.mjs --version "$RELEASE_VERSION"
          echo "normalized=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Validate, test, and build
        run: |
          node scripts/ci/validate-workspace.mjs
          pnpm validate:installer
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:coverage
          pnpm turbo run build

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            builder_args: --win nsis
            smoke_platform: windows
          - platform: macos
            runner: macos-14
            builder_args: --mac dmg zip
            smoke_platform: macos
          - platform: linux
            runner: ubuntu-22.04
            builder_args: --linux AppImage
            smoke_platform: linux
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require native code-signing credentials
        if: matrix.platform != 'linux'
        shell: bash
        env:
          NATIVE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE || secrets.WINDOWS_CERTIFICATE }}
          NATIVE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          NOTARIZATION_ACCOUNT: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZATION_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$NATIVE_CERTIFICATE" ] || [ -z "$NATIVE_CERTIFICATE_PASSWORD" ]; then
            echo "Native signing credentials are required for production releases." >&2
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "macos" ] && {
            [ -z "$NOTARIZATION_ACCOUNT" ] ||
            [ -z "$NOTARIZATION_PASSWORD" ] ||
            [ -z "$NOTARIZATION_TEAM" ];
          }; then
            echo "Apple notarization credentials are required for macOS releases." >&2
            exit 1
          fi

      - name: Package signed desktop application
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE || matrix.platform == 'windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || matrix.platform == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm --filter @e-agent/desktop package -- \
            ${{ matrix.builder_args }} \
            --config.publish.provider=github \
            --config.publish.owner=${{ github.repository_owner }} \
            --config.publish.repo=${{ github.event.repository.name }}

      - name: Verify Windows installer contract
        if: matrix.platform == 'windows'
        run: node scripts/smoke/verify-windows-installer.mjs --version ${{ needs.quality.outputs.version }}

      - name: Verify desktop production package contents
        run: pnpm verify:desktop-package

      - name: Smoke-test installer
        if: matrix.platform != 'linux'
        run: node scripts/smoke/smoke-desktop.mjs --platform ${{ matrix.smoke_platform }} --version ${{ needs.quality.outputs.version }}

      - name: Smoke-test Linux installer
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke/smoke-desktop.mjs --platform linux --version ${{ needs.quality.outputs.version }}

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem -LiteralPath release -File -Filter '*.exe'
            Get-Item -LiteralPath 'release/win-unpacked/E Agent.exe'
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($target.FullName) ($($signature.Status))"
            }
          }

      - name: Verify macOS code signature and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find release -type d -name 'E Agent.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Packaged application bundle was not found." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          while IFS= read -r dmg_path; do
            xcrun stapler validate "$dmg_path"
          done < <(find release -maxdepth 1 -type f -name '*.dmg' -print)

      - name: Collect desktop artifacts
        run: node scripts/release/collect-desktop-artifacts.mjs --output artifacts/${{ matrix.platform }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Container ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component:
          - server
          - web
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute container metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-agent-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.quality.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.quality.outputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/e-agent-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish release
    needs:
      - quality
      - desktop
      - containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-macos
          path: artifacts/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-linux
          path: artifacts/linux

      - name: Install dependency graph for SBOM
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate release metadata
        run: |
          node scripts/security/generate-sbom.mjs --output artifacts/sbom.cdx.json
          node scripts/release/create-release-manifest.mjs
          node scripts/release/generate-checksums.mjs
          node scripts/release/verify-artifacts.mjs

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksum manifest with GitHub OIDC
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/**

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.quality.outputs.version }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(needs.quality.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sigstore.json
            artifacts/release-manifest.json
            artifacts/sbom.cdx.json

      - name: Preserve release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.quality.outputs.version }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
