apiVersion: v1
kind: ConfigMap
metadata:
  name: e-agent-config
  namespace: e-agent
data:
  NODE_ENV: production
  E_AGENT_HOST: 0.0.0.0
  E_AGENT_PORT: '4318'
  E_AGENT_DATABASE_URL: /data/e-agent.db
  E_AGENT_LOG_LEVEL: info
  E_AGENT_LOG_DIR: /data/logs
  E_AGENT_ALLOWED_ORIGINS: https://e-agent.example.com
